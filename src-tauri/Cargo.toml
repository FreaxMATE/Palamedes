[package]
name = "palamedes"
version = "0.1.0"
description = "Personal AI chat app with branching conversations"
authors = ["Konstantin Unruh"]
license = "MIT"
repository = "https://github.com/FreaxMATE/Palamedes"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "palamedes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

async-openai = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = "0.8"
chrono = { version = "0.4", features = ["serde"] }
