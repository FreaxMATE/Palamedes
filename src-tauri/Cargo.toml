[package]
name = "palamedes"
version = "0.1.0"
description = "Audit-grade AI memory — the AI that remembers what you've ruled out."
authors = ["Konstantin Unruh"]
license = "AGPL-3.0-only"
repository = "https://github.com/FreaxMATE/Palamedes"
edition = "2021"
rust-version = "1.77.2"
# Two binaries ship from this crate: the Tauri app (`palamedes`) and the
# stdio MCP shim (`palamedes-mcp`, in src/bin/palamedes_mcp.rs). Tauri
# dev/build invokes `cargo run` / `cargo build` without --bin, so set
# the app as the default.
default-run = "palamedes"

[lib]
name = "palamedes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Stdio MCP shim for Claude Desktop. Speaks newline-delimited JSON-RPC on
# stdin/stdout and forwards to the running Tauri app's HTTP+SSE server.
[[bin]]
name = "palamedes-mcp"
path = "src/bin/palamedes_mcp.rs"

# Headless MCP HTTP server (no GUI). Opens the same SQLite ledger the Tauri
# app uses and binds 127.0.0.1:<mcp_server_port> from settings.
[[bin]]
name = "palamedes-mcp-serve"
path = "src/bin/palamedes_mcp_serve.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

async-openai = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# MCP server (Phase C). `rmcp` is Anthropic's official Rust SDK.
# Features: server-side tool handlers + the streamable-HTTP transport
# (Cursor, Open WebUI, Witsy). The stdio shim binary speaks pure JSON-RPC
# and doesn't need rmcp itself — it's a dumb HTTP proxy.
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
